---
services:
  mysql:
    image: "{{ .Image }}:{{ .ImageVersion }}"

    # the image's own entrypoint creates the database and both accounts from
    # these on first boot, so there is no command of our own
    environment:
      MYSQL_DATABASE: "{{ .Database }}"
      MYSQL_PASSWORD: "{{ .Secret.password }}"
      MYSQL_ROOT_PASSWORD: "{{ .Secret.root_password }}"
      MYSQL_USER: mysql

    volumes:
      - type: bind
        source: "{{ .HostRoot }}/config"
        target: /etc/mysql/conf.d
      - type: bind
        source: "{{ .HostRoot }}/data"
        target: /var/lib/mysql

    configs:
      - source: disable_performance_schema
        target: /etc/mysql/conf.d/disable_performance_schema.cnf
      - source: charset_utf8
        target: /etc/mysql/conf.d/charset_utf8.cnf

    ports:
      - name: native
        target: 3306
        primary: true

configs:
  disable_performance_schema:
    content: |
      [mysqld]
      performance_schema = 0

  charset_utf8:
    content: |
      [mysqld]
      character-set-server = utf8mb4
      collation-server = utf8mb4_unicode_ci

x-dokku:
  plugin: mysql
  title: MySQL
  scheme: mysql

  # DATABASE rather than MYSQL: a linked app gets DATABASE_URL, which is what
  # mysql, mariadb and postgres all hand over
  alias: DATABASE
  alt_alias: DOKKU_MYSQL

  dsn: "{{ .Scheme }}://{{ .Username }}:{{ .Password }}@{{ .Host }}:{{ .Port.native }}/{{ .Database }}"

  # handed over alongside the dsn by link --jdbc, for java drivers that cannot
  # read it. They take no credentials in the userinfo, so they go in the query
  jdbc:
    url: "jdbc:mysql://{{ .Host }}:{{ .Port.native }}/{{ .Database }}?user={{ urlescape .Username }}&password={{ urlescape .Password }}"
    username: "{{ .Username }}"
    password: "{{ .Password }}"

  # the image ships a client, but it answers before the server is accepting
  # connections during the entrypoint's own setup, so readiness stays on the
  # port probe every datastore uses
  wait: native

  # the databases and users a service holds beside its own, made as root. A
  # user is made for every host, and is given every privilege on each database
  # the service holds, and on each one made later, but none on the databases
  # the server keeps for itself and no grant option, so it can neither become
  # root nor make users of its own. Names are checked before they get here,
  # so they are quoted rather than escaped, and a password is written to the
  # client's stdin rather than passed as an argument. The same text as
  # mysql's and mariadb's, which a test holds them to.
  databases:
    create:
      exec:
        - sh
        - -c
        - |
          set -e
          database="$1"
          client="$2"
          users="$3"
          grant() {
            hosts="$("$client" --user=root --batch --skip-column-names -e "SELECT host FROM mysql.user WHERE user = '$2'")"
            printf '%s\n' "$hosts" | while IFS= read -r host; do
              [ -n "$host" ] || continue
              printf "GRANT ALL PRIVILEGES ON \`%s\`.* TO '%s'@'%s';\n" "$1" "$2" "$host"
            done
          }
          {
            printf 'CREATE DATABASE `%s`;\n' "$database"
            for user in $users; do
              grant "$database" "$user"
            done
          } | "$client" --user=root
        - dokku-mysql-create-database
        - "{{ .Args.database }}"
        - mysql
        - "{{ .Args.users }}"
      env:
        MYSQL_PWD: "{{ .Secret.root_password }}"

    # the grants on a database outlive it, and would hand a database made
    # later under the same name to whoever had this one, so they go with it
    destroy:
      exec:
        - sh
        - -c
        - |
          set -e
          database="$(printf '%s' "$1" | sed "s/'/''/g")"
          {
            printf 'DROP DATABASE `%s`;\n' "$1"
            printf "DELETE FROM mysql.db WHERE Db = '%s';\n" "$database"
            printf 'FLUSH PRIVILEGES;\n'
          } | "$2" --user=root
        - dokku-mysql-destroy-database
        - "{{ .Args.database }}"
        - mysql
      env:
        MYSQL_PWD: "{{ .Secret.root_password }}"

  users:
    default: mysql
    secret: password
    reserved: [root]
    create:
      exec:
        - sh
        - -c
        - |
          set -e
          user="$1"
          client="$2"
          databases="$3"
          password="$(printf '%s' "$NEW_PASSWORD" | sed "s/'/''/g")"
          {
            printf "CREATE USER '%s'@'%%' IDENTIFIED BY '%s';\n" "$user" "$password"
            for database in $databases; do
              printf "GRANT ALL PRIVILEGES ON \`%s\`.* TO '%s'@'%%';\n" "$database" "$user"
            done
          } | "$client" --user=root
        - dokku-mysql-create-user
        - "{{ .Args.user }}"
        - mysql
        - "{{ .Args.databases }}"
      env:
        MYSQL_PWD: "{{ .Secret.root_password }}"
        NEW_PASSWORD: "{{ .NewSecret }}"
    destroy:
      exec:
        - sh
        - -c
        - |
          set -e
          printf "DROP USER '%s'@'%%';\n" "$1" | "$2" --user=root
        - dokku-mysql-destroy-user
        - "{{ .Args.user }}"
        - mysql
      env:
        MYSQL_PWD: "{{ .Secret.root_password }}"

    # the same text as the password's own change, given the user to change
    change:
      exec:
        - sh
        - -c
        - |
          set -e
          user="$1"
          client="$2"
          password="$(printf '%s' "$NEW_PASSWORD" | sed "s/'/''/g")"
          hosts="$("$client" --user=root --batch --skip-column-names -e "SELECT host FROM mysql.user WHERE user = '$user'")"
          if [ -z "$hosts" ]; then
            echo "there is no $user account to change the password of" >&2
            exit 1
          fi
          printf '%s\n' "$hosts" | while IFS= read -r host; do
            printf "ALTER USER '%s'@'%s' IDENTIFIED BY '%s';\n" "$user" "$host" "$password"
          done | "$client" --user=root
        - dokku-mysql-change-password
        - "{{ .Args.user }}"
        - mysql
      env:
        MYSQL_PWD: "{{ .Secret.root_password }}"
        NEW_PASSWORD: "{{ .NewSecret }}"

  secrets:
    password:
      file: PASSWORD
      length: 16
      env: SERVICE_PASSWORD

      # the image only reads MYSQL_PASSWORD when it makes the data directory,
      # so the account is given its new password by the server itself, as root
      # and on every host the account is defined for. The statements are
      # written to the client's stdin rather than passed as arguments, so the
      # password stays out of the container's process table. The same text as
      # the root password's, and as mysql's and mariadb's, which a test holds
      # them to.
      change:
        exec:
          - sh
          - -c
          - |
            set -e
            user="$1"
            client="$2"
            password="$(printf '%s' "$NEW_PASSWORD" | sed "s/'/''/g")"
            hosts="$("$client" --user=root --batch --skip-column-names -e "SELECT host FROM mysql.user WHERE user = '$user'")"
            if [ -z "$hosts" ]; then
              echo "there is no $user account to change the password of" >&2
              exit 1
            fi
            printf '%s\n' "$hosts" | while IFS= read -r host; do
              printf "ALTER USER '%s'@'%s' IDENTIFIED BY '%s';\n" "$user" "$host" "$password"
            done | "$client" --user=root
          - dokku-mysql-change-password
          - mysql
          - mysql
        env:
          MYSQL_PWD: "{{ .Secret.root_password }}"
          NEW_PASSWORD: "{{ .NewSecret }}"

    root_password:
      file: ROOTPASSWORD
      length: 16
      env: SERVICE_ROOT_PASSWORD

      # root is made for every host it may log in from, and each is changed
      # with the password it logs in with now
      change:
        exec:
          - sh
          - -c
          - |
            set -e
            user="$1"
            client="$2"
            password="$(printf '%s' "$NEW_PASSWORD" | sed "s/'/''/g")"
            hosts="$("$client" --user=root --batch --skip-column-names -e "SELECT host FROM mysql.user WHERE user = '$user'")"
            if [ -z "$hosts" ]; then
              echo "there is no $user account to change the password of" >&2
              exit 1
            fi
            printf '%s\n' "$hosts" | while IFS= read -r host; do
              printf "ALTER USER '%s'@'%s' IDENTIFIED BY '%s';\n" "$user" "$host" "$password"
            done | "$client" --user=root
          - dokku-mysql-change-password
          - root
          - mysql
        env:
          MYSQL_PWD: "{{ .Secret.root_password }}"
          NEW_PASSWORD: "{{ .NewSecret }}"

  commands:
    # the password goes in MYSQL_PWD rather than on the command line, so it is
    # not in the container's process table where any other process could read
    # it. The bash plugin passes --password, which mysql itself warns about.
    # --unbuffered flushes each result as it is printed: without a terminal,
    # as over ssh without -t, mysql otherwise holds every result until it exits.
    connect:
      exec: ["mysql", "--user={{ .Username }}", "--unbuffered", "--database={{ .Database }}"]
      env:
        MYSQL_PWD: "{{ .Password }}"
        LANG: C.UTF-8
        LC_ALL: C.UTF-8

    export:
      extra_args: true
      exec:
        - mysqldump
        - --default-character-set=utf8mb4
        - --user=root
        - --single-transaction
        - --no-tablespaces
        - --quick
        # without this the dump carries the transaction ids it was taken from,
        # and replaying it into a server that already has them is refused. That
        # is every restore of a service onto itself, and every clone, since the
        # new service has ids of its own from its first boot.
        - --set-gtid-purged=OFF
        - "{{ .Database }}"
      env:
        MYSQL_PWD: "{{ .Secret.root_password }}"

      # every database but the ones the server keeps for itself, whose
      # accounts and grants would otherwise be loaded over the target's. The
      # dump drops and makes each database again before loading it, under the
      # name it was exported from, so it is loaded without naming one.
      all_databases:
        extra_args: true
        exec:
          - bash
          - -c
          - |
            set -eo pipefail
            listing="$(mysql --user=root -N -B -e "
              SELECT schema_name FROM information_schema.schemata
               WHERE schema_name NOT IN ('mysql', 'sys', 'information_schema', 'performance_schema')
               ORDER BY schema_name")"
            mapfile -t databases <<<"$listing"
            exec mysqldump "$@" --add-drop-database --databases "${databases[@]}"
          - dokku-mysql-export-all
          - --default-character-set=utf8mb4
          - --user=root
          - --single-transaction
          - --no-tablespaces
          - --quick
          - --set-gtid-purged=OFF
        env:
          MYSQL_PWD: "{{ .Secret.root_password }}"

    import:
      extra_args: true
      stdin: true
      exec: ["mysql", "--user=root", "{{ .Database }}"]
      env:
        MYSQL_PWD: "{{ .Secret.root_password }}"

      # a dump of every database names each one it loads, so none is named here
      all_databases:
        extra_args: true
        stdin: true
        exec: ["mysql", "--user=root"]
        env:
          MYSQL_PWD: "{{ .Secret.root_password }}"

    # the database is dropped and made again with the character set and
    # collation it had, which takes the tables, views, routines, triggers and
    # events in it. Grants on the database are kept by name rather than with it,
    # so the account a linked app connects as keeps its access. Other sessions in
    # the database are ended first, as a transaction one holds open would leave
    # the drop waiting on its lock; lock_wait_timeout fails the drop rather than
    # leaving it waiting for a year should one start in between.
    #
    # the create statement is read before anything is dropped, so a database
    # that cannot be described is left alone. Written inline rather than shipped
    # as a script, since a script is only mounted into a container made after
    # it was added, and a reset runs in the container the service already has.
    # The same text as mariadb's, which passes the client it ships instead.
    reset:
      exec:
        - sh
        - -c
        - |
          set -e
          database="$1"
          client="$2"
          sql() {
            "$client" --user=root --batch --skip-column-names --database="$database" "$@"
          }
          create="$(sql <<'SQL'
          SELECT CONCAT('CREATE DATABASE `', SCHEMA_NAME, '` CHARACTER SET ', DEFAULT_CHARACTER_SET_NAME, ' COLLATE ', DEFAULT_COLLATION_NAME)
            FROM information_schema.SCHEMATA WHERE SCHEMA_NAME = DATABASE();
          SQL
          )"
          if [ -z "$create" ]; then
            echo "unable to read how the $database database was created" >&2
            exit 1
          fi
          for id in $(sql -e "SELECT ID FROM information_schema.PROCESSLIST WHERE DB = DATABASE() AND ID <> CONNECTION_ID()"); do
            sql -e "KILL $id" >/dev/null 2>&1 || true
          done
          printf '%s\n' \
            "SET SESSION lock_wait_timeout = 60;" \
            "DROP DATABASE \`$database\`;" \
            "$create;" | sql
        - dokku-mysql-reset
        - "{{ .Database }}"
        - mysql
      env:
        MYSQL_PWD: "{{ .Secret.root_password }}"

  # the databases the server keeps for itself. A service named after one would
  # hand its app the server's own database rather than one of its own
  reserved_names: [information_schema, mysql, performance_schema, sys]
